apiVersion: v1
kind: Service
metadata:
  name: my-fastapi-app-service
  namespace: production
  labels:
    app: my-fastapi-app
spec:
  selector:
    app: my-fastapi-app
  type: ClusterIP          # change to LoadBalancer or NodePort if needed
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
