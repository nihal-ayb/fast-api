apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-fastapi-app-deployment
  namespace: production
  labels:
    app: my-fastapi-app
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-fastapi-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: my-fastapi-app
        tier: backend
    spec:
      containers:
        - name: my-fastapi-app
          # Jenkinsfile rewrites this line with the new build tag (sed matches on the image name)
          image: nihalayb/my-fastapi-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
